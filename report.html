<main class="wrap secondary-page">

  <p><a href="index.html#rankings">← Program index</a></p>
  <h1>Report a correction.</h1>
  <p class="page-description" id="report-explain">Save a draft with the program and publication details for the maintainer.</p>
  <form class="quality-card report-form" id="report-form">
    <label for="report-program">Program</label><select id="report-program" name="program" required><option value="">Choose a program</option></select>
    <label for="issue-type">Issue</label><select id="issue-type" name="type"><option>Missing paper</option><option>Wrong author match</option><option>Faculty roster or appointment</option><option>Program status</option></select>
    <label for="paper">Paper title or DOI</label><input type="text" id="paper" name="paper" maxlength="220">
    <label for="evidence">Public source URL</label><input type="url" id="evidence" name="evidence" maxlength="300">
    <label for="details">What should change?</label><textarea id="details" name="details" required rows="5" maxlength="1200"></textarea>
    <button id="report-label" class="primary-button" type="submit">Download correction draft</button>
  </form>

</main>
